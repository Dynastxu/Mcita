name: datagen-check

# Runs the NeoForge data generator and fails when the committed output under
# src/generated no longer matches what the current sources produce.
#
# Triggered only when the datagen sources, the generated files, or the build
# configuration that drives datagen change, so unrelated commits stay fast.

on:
  push:
    paths:
      - 'src/main/java/**/datagen/**'
      - 'src/generated/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - '.github/workflows/datagen-check.yml'
  pull_request:
    paths:
      - 'src/main/java/**/datagen/**'
      - 'src/generated/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - '.github/workflows/datagen-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  datagen-check:
    name: Generated data is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Writes into src/generated/resources (see the `data` run config in build.gradle).
      # Datagen cache files under src/generated/**/.cache are gitignored.
      - name: Run data generation
        run: ./gradlew runData --stacktrace

      - name: Verify no uncommitted changes
        run: |
          set -euo pipefail

          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "::error title=datagen-check failed::runData produced changes that are not committed. Run './gradlew runData' and commit the result."
            echo
            echo "--- git status --porcelain ---"
            printf '%s\n' "$changes"
            echo
            echo "--- git diff ---"
            git --no-pager diff
            echo
            echo "--- untracked files ---"
            git ls-files --others --exclude-standard
            exit 1
          fi

          echo "Datagen output matches the committed sources."
